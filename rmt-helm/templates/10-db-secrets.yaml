{{- if .Values.secrets.create }}
---
{{- $component := "db" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rmt.dbSecretName" . }}
type: Opaque
data:
  {{- if .Release.IsInstall }}
  password: {{ .Values.db.mysql.password | default (randAlphaNum 10) | b64enc | quote }}
  {{- else }}
  password: {{ (lookup "v1" "Secret" .Release.Namespace (include "rmt.dbSecretName" .)).data.password }}
  {{- end }}
  {{- if .Release.IsInstall }}
  rootPassword: {{ .Values.db.mysql.rootPassword | default (randAlphaNum 10) | b64enc | quote }}
  {{- else }}
  rootPassword: {{ (lookup "v1" "Secret" .Release.Namespace (include "rmt.dbSecretName" .)).data.rootPassword }}
  {{- end }}
{{- end }}
