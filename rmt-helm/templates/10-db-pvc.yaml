---
{{- if not .Values.db.storage.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rmt.db.pvcName" . }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.db.storage.class }}
  resources:
    requests:
      storage: {{ .Values.db.storage.size }}
{{- end }}
