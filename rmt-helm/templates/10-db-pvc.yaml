---
{{- $defaultName := printf "%s-db" (include "rmt.fullname" .) }}
{{- $claim := .Values.db.storage.existingClaim | toString }}
{{- if or (not $claim) (eq $claim $defaultName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $defaultName }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.db.storage.class }}
  resources:
    requests:
      storage: {{ .Values.db.storage.size }}
{{- end }}
