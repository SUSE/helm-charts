---
{{- $defaultName := printf "%s-app" (include "rmt.fullname" .) }}
{{- $claim := .Values.app.storage.existingClaim | toString }}
{{- if or (not $claim) (eq $claim $defaultName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $defaultName }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes: {{- toYaml .Values.app.storage.accessModes | nindent 4 }}
  storageClassName: {{ .Values.app.storage.class }}
  resources:
    requests:
      storage: {{ .Values.app.storage.size }}
{{- end }}
